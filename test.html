<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>
        WebSocket Test
    </title>
</head>
<body>
    <h1>WebSocket Test</h1>
    <div id="setupScreen">
        <button onclick="handleCreateRoom()">создать комнату</button>
        <br><br>
        <input type="text" id="joinCodeInput" placeholder="код комнаты">
        <button onclick="handleJoinRoom()">присоединиться</button>
    </div>

    <div id="chatScreen" style="display: none;">
        <p id="roomInfo"></p>
        <input type="text" id="messageInput" placeholder="введите сообщение">
        <button onclick="sendMessage()">отправить</button>
        <ul id="messages"></ul>
        <hr>
        <input type="file" id="fileInput">
        <button onclick="sendFile()">отправить файл</button>
        <p id="progressInfo"></p>
    </div>

<script src="app.js"></script>
</body>
</html>
